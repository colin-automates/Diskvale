name: Prepare signed Windows release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the build without requesting a signature
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: diskvale-code-signing
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check signing configuration and version
        id: config
        shell: powershell
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: ./scripts/check_signing_setup.ps1 -DryRun:($env:DRY_RUN -eq 'true')
      - name: Install Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run standard tests
        run: cargo test --locked
      - name: Check warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check signing content regressions
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Build portable application
        shell: powershell
        run: ./scripts/build_release.ps1
      - name: Check signed packaging guards
        shell: powershell
        run: ./scripts/tests/check_signing_guards.ps1
      - name: Check unsigned executable resources
        run: python scripts/check_brand_resources.py
      - name: Stage the exact signing input
        shell: powershell
        run: |
          New-Item -ItemType Directory artifacts/signing-input | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/canopy.exe -Destination artifacts/signing-input/Diskvale.exe
      - name: Upload unsigned executable for origin verification
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Diskvale-signing-input
          path: artifacts/signing-input/Diskvale.exe
          if-no-files-found: error
          retention-days: 7
      - name: Request manually approved signature
        if: ${{ !inputs.dry_run }}
        id: sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signing-result
          parameters: |
            version: "${{ steps.config.outputs.version }}"
      - name: Verify the approved signature and executable content
        if: ${{ !inputs.dry_run }}
        shell: powershell
        env:
          EXPECTED_CERTIFICATE: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          SIGNING_REQUEST: ${{ steps.sign.outputs.signing-request-id }}
        run: |
          ./scripts/prepare_signed_release.ps1 -UnsignedExecutable artifacts/signing-input/Diskvale.exe -SignedExecutable artifacts/signing-result/Diskvale.exe -BuildInfo target/x86_64-pc-windows-msvc/release/BUILD_INFO.json -ExpectedCertificateThumbprint $env:EXPECTED_CERTIFICATE -SigningRequestId $env:SIGNING_REQUEST -OutputDirectory artifacts/signed-build
          ./scripts/package_release.ps1 -Executable artifacts/signed-build/Diskvale.exe -OutputDirectory artifacts/signed-release -RequireSignature
          python scripts/check_brand_resources.py --executable artifacts/signed-release/Diskvale.exe --output artifacts/signed-release/resource-checks
          if ($LASTEXITCODE -ne 0) { throw 'Signed resource verification failed.' }
      - name: Save the signed release package
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Diskvale-signed-windows-x64
          if-no-files-found: error
          path: |
            artifacts/signed-release/Diskvale.exe
            artifacts/signed-release/Diskvale-windows-x64.zip
            artifacts/signed-release/SHA256SUMS.txt
            artifacts/signed-release/BUILD_INFO.json
            artifacts/signed-release/THIRD_PARTY_NOTICES.txt
            artifacts/signed-release/Diskvale-Demo.mp4
      - name: Report preparation status
        shell: powershell
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ($env:DRY_RUN -eq 'true') {
            'Dry run passed. No signing request was submitted; the signing-input artifact is unsigned.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            'Signed package verified and uploaded. Follow docs/release.md before tagging or publishing a new release.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
